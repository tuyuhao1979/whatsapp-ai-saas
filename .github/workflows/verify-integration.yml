name: Verify — isolated stack (multi-tenant + Schemathesis)

# End-to-end verification against a throwaway environment: postgres + redis +
# minio + a mock Meta Graph API, with tenant-api and gateway built from source.
# No real Meta credential, WABA, or production data is involved.
#
# The two suites are complementary:
#   * infra/e2e/test_multitenant.py drives RLS isolation, RBAC, WABA/phone
#     ownership proof, the Embedded Signup state machine and webhook signature
#     checks using real tenant ids and tokens.
#   * Schemathesis fuzzes every operation in infra/contracts/openapi-tenant-api.json
#     looking for 5xx responses (not_a_server_error) and for invalid data that
#     the API accepts instead of rejecting (negative_data_rejection).

on:
  push:
    paths:
      - 'services/tenant-api/**'
      - 'services/gateway/**'
      - 'infra/contracts/**'
      - 'infra/e2e/**'
      - 'infra/verify/**'
      - 'infra/redis/**'
      - 'infra/migrations/**'
      - '.github/workflows/verify-integration.yml'
  pull_request:
    paths:
      - 'services/tenant-api/**'
      - 'services/gateway/**'
      - 'infra/contracts/**'
      - 'infra/e2e/**'
      - 'infra/verify/**'
      - 'infra/redis/**'
      - 'infra/migrations/**'
      - '.github/workflows/verify-integration.yml'

jobs:
  verify:
    name: isolated stack — multi-tenant + Schemathesis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned: Schemathesis' CLI surface changes between majors.
      # `cryptography` is needed by infra/e2e/verify_token_crypto.py, which
      # imports flow-engine's decryptor to prove both services agree on the
      # access-token envelope.
      - name: Install Schemathesis
        run: pip install 'schemathesis==4.28.0' cryptography

      # Pull the base images up front with retries. Shared CI runners hit Docker
      # Hub anonymous-pull denials intermittently; without this the whole job
      # dies on a registry hiccup rather than on a real failure. The stack's
      # minio service is behind the `storage` profile and is not started here.
      - name: Pre-pull base images
        run: |
          for image in postgres:16-alpine redis:7-alpine python:3.12-alpine; do
            for attempt in 1 2 3; do
              if docker pull "$image"; then break; fi
              echo "pull failed for $image (attempt $attempt), retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
            docker image inspect "$image" > /dev/null
          done

      # Brings the stack up, applies infra/migrations/*.sql in order, and waits
      # for tenant-api. `docker compose up` on its own leaves an empty database,
      # so every query would fail with "relation ... does not exist".
      - name: Start the stack and apply migrations
        run: bash infra/verify/run-verification.sh

      - name: Multi-tenant isolation, RBAC and Meta onboarding
        run: python3 infra/e2e/test_multitenant.py

      # Covers audit findings H1 + H6: the stored access token must be bound to
      # its row (a ciphertext copied to another tenant must fail to decrypt),
      # keyed per tenant, and migratable off a legacy v1 ciphertext.
      - name: Access-token envelope (row binding, key ids, v1 -> v2 migration)
        run: python3 infra/e2e/verify_token_crypto.py

      - name: Schemathesis — no 5xx, invalid input rejected
        run: |
          RUN_ID=$(date +%s)
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:13001/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"tenant_name\":\"CI Fuzz ${RUN_ID}\",\"email\":\"fuzz-${RUN_ID}@verify.test\",\"password\":\"MultiTenantTest1!\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])')

          schemathesis run infra/contracts/openapi-tenant-api.json \
            --origin http://127.0.0.1:13001 \
            -H "Authorization: Bearer ${TOKEN}" \
            --checks not_a_server_error,negative_data_rejection \
            --max-examples 30 \
            --no-color

      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/verify/docker-compose.verify.yml logs --tail 200

      - name: Tear down
        if: always()
        # --profile storage so a profiled service is removed too.
        run: docker compose -f infra/verify/docker-compose.verify.yml --profile storage down -v
