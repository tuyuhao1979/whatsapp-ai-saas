name: CI — Python services

on:
  push:
    paths:
      - 'services/flow-engine/**'
      - 'services/rag-indexer/**'
  pull_request:
    paths:
      - 'services/flow-engine/**'
      - 'services/rag-indexer/**'

jobs:
  flow-engine:
    name: flow-engine — lint + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flow-engine
    # A real, authenticated ChromaDB for tests/integration/: the unit tests can
    # assert the bearer header is passed, but only a server can show it is
    # accepted and that everything else is refused (audit finding H3).
    services:
      chromadb:
        image: chromadb/chroma:0.5.23
        env:
          ANONYMIZED_TELEMETRY: "false"
          CHROMA_SERVER_AUTHN_PROVIDER: chromadb.auth.token_authn.TokenAuthenticationServerProvider
          CHROMA_SERVER_AUTHN_CREDENTIALS: ci-chroma-auth-token
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check flow_engine/

      - name: Type check (mypy)
        run: mypy flow_engine/ --ignore-missing-imports

      - name: Test
        env:
          # tests/integration/ skips when these are unset, so the same command
          # works outside CI.
          CHROMA_INTEGRATION_URL: http://127.0.0.1:8000
          CHROMA_AUTH_TOKEN: ci-chroma-auth-token
        run: pytest tests/ -v --tb=short

  rag-indexer:
    name: rag-indexer — lint + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag-indexer
    services:
      chromadb:
        image: chromadb/chroma:0.5.23
        env:
          ANONYMIZED_TELEMETRY: "false"
          CHROMA_SERVER_AUTHN_PROVIDER: chromadb.auth.token_authn.TokenAuthenticationServerProvider
          CHROMA_SERVER_AUTHN_CREDENTIALS: ci-chroma-auth-token
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check rag_indexer/

      - name: Type check (mypy)
        run: mypy rag_indexer/ --ignore-missing-imports

      - name: Test
        env:
          CHROMA_INTEGRATION_URL: http://127.0.0.1:8000
          CHROMA_AUTH_TOKEN: ci-chroma-auth-token
        run: pytest tests/ -v --tb=short
