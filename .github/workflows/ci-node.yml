name: CI — Node.js services

on:
  push:
    paths:
      - 'services/gateway/**'
      - 'services/tenant-api/**'
  pull_request:
    paths:
      - 'services/gateway/**'
      - 'services/tenant-api/**'

jobs:
  gateway:
    name: gateway — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway

    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH *before* actions/setup-node runs: its `cache: pnpm`
      # step shells out to `pnpm store path`, and without pnpm present the action
      # aborts with "Unable to locate executable file: pnpm" — which skipped every
      # lint and test step in this workflow.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: services/gateway/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm test -- --coverage` forwarded `--coverage` after `--`, so jest read
      # it as a filename pattern and exited with "No tests found". The
      # jest:coverage script passes the flag correctly and applies the global
      # floor from jest.config.js.
      - name: Test with coverage
        run: pnpm test:coverage

      # The 80% application-layer gate, scoped with --collectCoverageFrom so it
      # measures src/application/ (91.2% lines) rather than the whole service
      # (58.6%), which can only be lifted by mocking pg and Redis.
      - name: Coverage gate (80% application layer)
        run: |
          pnpm exec jest --coverage \
            --collectCoverageFrom='src/application/**/*.ts' \
            --coverageThreshold='{"global":{"lines":80}}'

  tenant-api:
    name: tenant-api — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tenant-api

    steps:
      - uses: actions/checkout@v4

      # See the gateway job: pnpm must exist before setup-node's cache step.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: services/tenant-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Required before lint, tests or build. @prisma/client's postinstall runs
      # from the workspace root, where it cannot find prisma/schema.prisma, so it
      # prints "We could not find your Prisma schema in the default locations"
      # and leaves the client untyped. The typed lint rules then report ~147
      # "Unsafe member access ... on an `any` value" errors against
      # prisma.tenant / prisma.user / prisma.flow / prisma.knowledgeBaseDocument,
      # and nothing else in the job gets a chance to run.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      # See the gateway job: `pnpm test -- --coverage` made jest treat
      # `--coverage` as a test pattern.
      - name: Test with coverage
        run: pnpm test:coverage
