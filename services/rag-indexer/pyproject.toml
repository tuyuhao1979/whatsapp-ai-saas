[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-indexer"
version = "0.1.0"
description = "RAG document indexer service for the WhatsApp AI SaaS platform"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the ChromaDB server image in infra/docker-compose.yml, not
    # `>=0.5`: an open-ended constraint resolved to chromadb 1.x, whose
    # create-collection payload the deployed 0.5.23 server rejects with
    #   Exception {"error":"KeyError('_type')"}
    # so the indexer could not create a collection and every document failed to
    # index. The client major tracks the server image; move both together.
    # tests/unit/test_chroma_version_alignment.py guards the pair.
    "chromadb==0.5.23",
    "sentence-transformers>=2.7",
    "redis>=5.0",
    "minio>=7.2",
    "psycopg2-binary>=2.9",
    "pypdf>=4.0",
    "mistune>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.26",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
rag-indexer = "rag_indexer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["rag_indexer"]

[tool.ruff]
# Pinned explicitly: ruff's default rule set has grown over time, so an
# unpinned `ruff check` silently became stricter and turned CI red without any
# code change. Selecting the families below (and the target version) keeps the
# intent stable across ruff releases.
target-version = "py312"
line-length = 100
src = ["rag_indexer"]

[tool.ruff.lint]
# Scope is deliberate, not a relaxation of defaults. ruff's *default* set has
# grown across releases, so an unpinned `ruff check` silently became stricter
# and turned CI red without any code change — the target version and rule
# families are pinned here so intent stays stable.
#
# Selected because they catch mistakes: E/W, F, I, UP, B, BLE, PYI, RUF.
# Deliberately NOT selected: SIM and TRY (refactoring opinions, no defect signal
# on this codebase).
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # blind except
    "RUF",  # ruff-specific
    "PYI",  # typing stubs conventions
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on failure modes and use long literals on purpose.
"tests/**" = ["B", "BLE"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "--strict-markers",
]

[tool.coverage.run]
source = ["rag_indexer"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
