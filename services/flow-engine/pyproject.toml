[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow-engine"
version = "0.1.0"
description = "Flow Engine service for the WhatsApp AI SaaS platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "chromadb>=0.5",
    "cryptography>=42.0",
    "sentence-transformers>=2.7",
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langchain-core>=0.3,<0.4",
    "httpx>=0.27",
    "jmespath>=1.0",
    "python-json-logger>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
flow-engine = "flow_engine.main:main"

[tool.hatch.build.targets.wheel]
packages = ["flow_engine"]

[tool.ruff]
# Pinned explicitly: ruff's default rule set has grown over time, so an
# unpinned `ruff check` silently became stricter and turned CI red without any
# code change. Selecting the families below (and the target version) keeps the
# intent stable across ruff releases.
target-version = "py312"
line-length = 100
src = ["flow_engine"]

[tool.ruff.lint]
# Scope is deliberate, not a relaxation of defaults. ruff's *default* set has
# grown across releases, so an unpinned `ruff check` silently became stricter
# and turned CI red without any code change — the target version and rule
# families are pinned here so intent stays stable.
#
# Selected because they catch mistakes: E/W (pycodestyle), F (pyflakes),
# I (import order), UP (pyupgrade), B (bugbear), BLE (blind except),
# PYI/RUF (ruff-specific correctness).
# Deliberately NOT selected: SIM and TRY. Both are refactoring-opinion families
# that, on this codebase, produced ~15 suggestions (prefer contextlib.suppress,
# prefer raise-from, prefer else) with no defect signal. Everything selected
# above is enforced with zero ignores except the one documented below.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # blind except
    "RUF",  # ruff-specific
    "PYI",  # typing stubs conventions
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on failure modes and use long literals on purpose.
"tests/**" = ["B", "BLE"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# redis-py ships partially-generic command signatures; the unavoidable
# mismatches are annotated inline with a justification instead of being
# silenced here.
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "--strict-markers",
]

[tool.coverage.run]
source = ["flow_engine"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
